# ZMK's caps word, plus stop-list (keys that end it even if they are modifiers) and keypad digits.
description: Caps word that can be stopped by chosen keys

compatible: "korz,behavior-caps-word"

include: zero_param.yaml

properties:
  continue-list:
    type: array
    required: true
    description: Keys that do not end caps word (as in ZMK's caps word)
  mods:
    type: int
    description: Modifiers added to the letters (default left shift)
  stop-list:
    type: array
    description: |
      Keys that end caps word, modifiers included. ZMK's caps word ignores modifier keys;
      list one here (for example LCTRL) to make it end caps word.
  keypad-numbers:
    type: boolean
    description: Keypad digits (KP_N0..KP_N9) continue caps word, like the number row
